# Netlify configuration for Next.js App Router (SSR + API Routes)
# This file is REQUIRED for Next.js API routes to work on Netlify.
# Without it, /api/* requests return HTML instead of executing server code.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# The Essential Next.js plugin handles SSR, API routes, and Edge functions.
# It MUST be listed here so Netlify deploys API routes as server-side functions.
[[plugins]]
  package = "@netlify/plugin-nextjs"
